<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flow Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand"><span class="dot" id="status-dot"></span> Flow Agent</div>
    <div class="meta"><span id="model">connecting…</span> · <span id="workspace"></span></div>
  </header>

  <section class="metrics">
    <div><b id="m-words">0</b><span>words dictated</span></div>
    <div><b id="m-instr">0</b><span>instructions</span></div>
    <div><b id="m-interrupts">0</b><span>barge-ins</span></div>
    <div><b id="m-tools">0</b><span>tool calls</span></div>
  </section>

  <main id="log" aria-live="polite"></main>

  <footer>
    <textarea id="input" rows="2" placeholder="Hold your Wispr Flow key and speak. Talk over the agent any time to interrupt it."></textarea>
    <div class="controls">
      <label><input type="checkbox" id="autosend" checked /> Auto-send after dictation</label>
      <label><input type="checkbox" id="narrate" checked /> Speak replies</label>
      <span class="spacer"></span>
      <button id="stop" class="secondary">Stop</button>
      <button id="send">Send</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
